name: event_tracker_analytics
description: "Flutter SDK for the Analytics platform: tracks screens, sessions and custom events and sends them in batches to the ingest API."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

